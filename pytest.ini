[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Research scripts that live under tests/ but are NOT pytest:
#   tests/test_external_validity.py     — ablation study
#   tests/test_regime_signal_ablation.py — regime-signal ablation
#   tests/robustness_checks.py          — robustness grid
# They import heavy code and run analyses at module level; excluded so
# that `pytest tests/` discovery doesn't try to collect them.
addopts =
    --ignore=tests/test_external_validity.py
    --ignore=tests/test_regime_signal_ablation.py
    --ignore=tests/robustness_checks.py
    -ra

# Silence the pandas 'M' -> 'ME' deprecation noise from older scripts.
filterwarnings =
    ignore::FutureWarning:pandas
