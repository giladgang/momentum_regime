name: latex

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-thesis:
    # Compiles main.tex with bibtex so broken \input{tables/...} or
    # \includegraphics{plots/...} references surface on every push,
    # not at submission time. The compiled PDF is uploaded as an
    # artifact for review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: main.pdf
          if-no-files-found: warn
