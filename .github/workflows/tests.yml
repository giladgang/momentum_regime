name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    # Runs the artefact-independent tests: config sanity, unit tests for
    # src/utils, portfolio edge cases on synthetic fixtures, pipeline
    # orchestration smoke, and CV-script helper tests. Data-dependent
    # tests inside these files auto-skip via fixtures in tests/conftest.py
    # when the 943 MB artefacts pickle is absent (which it is in CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fast tests
        run: |
          pytest tests/test_config.py \
                 tests/test_utils.py \
                 tests/test_portfolio_edge_cases.py \
                 tests/test_pipeline_smoke.py \
                 tests/test_cv_scripts.py \
                 -v --tb=short
