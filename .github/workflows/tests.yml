name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    # Runs the artefact-independent tests: config sanity, portfolio
    # edge cases on synthetic fixtures, and pipeline-orchestration
    # smoke tests. All other test files depend on the 943MB
    # cs_artefacts_data.pkl which isn't in git, so they run locally
    # via `python run_pipeline.py` and not in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest

      - name: Run fast tests
        run: |
          pytest tests/test_config.py \
                 tests/test_portfolio_edge_cases.py \
                 tests/test_pipeline_smoke.py \
                 -v --tb=short
